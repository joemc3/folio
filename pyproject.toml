[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "folio-profile"
version = "0.1.0"
description = "Generate a spectacular GitHub profile page from your local machine."
requires-python = ">=3.11"
license = "MIT"

dependencies = [
    "typer[all]>=0.12",
    "rich>=13",
    "pydantic>=2",
    "PyGithub>=2",
    "GitPython>=3",
    "litellm>=1.40",
    "jinja2>=3",
    "pyyaml>=6",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[project.scripts]
folio = "folio.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["folio"]
